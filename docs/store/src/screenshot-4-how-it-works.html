<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .wrap { flex-direction: column; padding: 64px 70px; height: 100%; display: flex; gap: 22px; }
  .steps { grid-template-columns: repeat(3, 1fr); margin-top: 30px; display: grid; gap: 30px; }
  .step { border: 1px solid var(--border); flex-direction: column; border-radius: 18px; background: #1f1b26cc; padding: 26px; display: flex; gap: 16px; }
  .num { box-shadow: 0 0 0 6px #ff6a3d26; place-items: center; border-radius: 50%; background: var(--accent); font-weight: 900; font-size: 26px; color: #1f0a00; display: grid; height: 54px; width: 54px; }
  .step h3 { font-family: Caveat, cursive; font-size: 40px; line-height: 1; }
  .step p { line-height: 1.5; color: var(--muted); font-size: 18px; }
  .step p b { color: var(--text); }
  .art { place-items: center; border-radius: 12px; background: #120e18; position: relative; margin-top: auto; display: grid; height: 200px; }
  .pill { border-radius: 10px; background: var(--accent); padding: 12px 18px; font-weight: 800; font-size: 18px; color: #1f0a00; }
  .mini { border: 3px solid var(--accent); border-radius: 10px; position: relative; overflow: hidden; height: 150px; width: 250px; }
  .mini .label { background: var(--accent); border-radius: 5px; position: absolute; padding: 3px 8px; font-weight: 700; font-size: 13px; color: #1f0a00; left: 8px; top: 8px; }
  .art .tape { transform: rotate(-6deg); width: 230px; }
</style></head><body>
<div class="wrap">
  <div class="brand"><img src="assets/icon.svg">Callette</div>
  <h1 data-t="s4_h1"></h1>
  <p class="lead" data-t="s4_lead"></p>
  <div class="steps">
    <div class="step"><span class="num">1</span><h3 data-t="s4_t1"></h3><p data-t="s4_p1"></p>
      <div class="art"><span class="pill" data-t="p_btn"></span></div></div>
    <div class="step"><span class="num">2</span><h3 data-t="s4_t2"></h3><p data-t="s4_p2"></p>
      <div class="art"><div class="mini" data-person='{"bg":"#2c4a52","skin":"#c98e6b","shirt":"#ff8f52","hair":"#1d1512"}'><span class="label" data-t="labelStream"></span></div></div></div>
    <div class="step"><span class="num">3</span><h3 data-t="s4_t3"></h3><p data-t="s4_p3"></p>
      <div class="art"><div class="tape" data-cassette='{"color":"#ff6a3d","label":"@c_mkv","left":0.15}'></div></div></div>
  </div>
</div>
<script src="strings.js"></script><script src="common.js"></script>
</body></html>
